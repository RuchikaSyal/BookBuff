*{box-sizing:border-box}
body{margin:0;font:300 16px/1.7 var(--sans);color:#000;background:#fff}
a{color:inherit}img{max-width:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.25;margin:0 0 .5em}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
.bar{background:var(--terra)}.social{display:flex;gap:18px;align-items:center}.bar .wrap{justify-content:flex-end;height:40px}.social a{display:inline-flex;width:22px;height:22px;color:#fff;transition:transform .15s,opacity .15s;opacity:.95}.social a:hover{transform:translateY(-2px);opacity:1}.social svg{width:100%;height:100%}footer .social{justify-content:center;margin-bottom:12px}footer .social a{color:#fff}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:72px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:24px;text-decoration:none}
.nav nav{display:flex;gap:28px}
.nav nav a{text-decoration:none;font-size:15px}.nav nav a.on,.nav nav a:hover{color:var(--terra)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{height:380px;background:var(--rose) center/cover;display:flex;align-items:flex-end;padding:24px;text-decoration:none;position:relative;transition:filter .3s}
.tile:nth-child(2){background-color:#d29b89}.tile:nth-child(3){background-color:var(--terra)}
.tile:hover{filter:brightness(.94)}
.tile span{font:400 28px var(--serif);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25);margin-bottom:60px}
.hero-title{background:#fff;width:min(640px,90%);margin:-62px auto 0;text-align:center;padding:14px 0 6px;position:relative}
.hero-title h1{font-size:40px;margin:0}
.hero-title p{margin:0;color:var(--muted)}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;margin:70px auto}
.card{display:grid;grid-template-columns:42% 1fr;border:1px solid var(--line);text-decoration:none;margin-bottom:28px;min-height:200px;transition:box-shadow .3s}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.08)}
.card .img{background:var(--blush) center/cover}
.card .txt{padding:22px 24px}.card small{color:var(--muted);font-size:12.5px}
.card h3{font-size:22px;margin:.35em 0}.card p{margin:.4em 0 0;color:#333;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--terra);letter-spacing:2px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;margin:40px 0 70px}
.grid .card{grid-template-columns:1fr;margin:0}.grid .card .img{height:210px}
.btn,button.btn{display:inline-block;background:var(--terra);color:#fff;border:0;padding:12px 34px;font:700 16px var(--sans);text-decoration:none;cursor:pointer;transition:background .3s}
.btn:hover{background:#9c4528}
aside{background:var(--blush);padding:44px 28px}
.news{background:var(--terra);color:#fff;padding:36px 30px;text-align:center}
.news h2{font-size:32px;color:#fff}
label{display:block;text-align:left;font:600 14px var(--sans);margin-top:14px}
input,textarea,select{width:100%;border:0;border-bottom:1px solid #777;background:transparent;padding:8px 0;font:300 16px var(--sans);color:inherit;outline:0;border-radius:0}
.news input{border-color:#fff}.news .btn{margin-top:22px;width:100%;background:#fff;color:var(--terra)}
.cats{list-style:none;padding:0;margin:34px 0 0;text-align:center}.cats li{margin:6px 0}
.cats a{font:400 20px var(--serif);text-decoration:none}.cats a:hover{color:var(--terra)}
.contact{background:var(--blush);padding:70px 0}
.contact h2{text-align:center;font-size:36px}
.contact form{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.contact form .full{grid-column:1/-1}.contact .btn{margin:28px auto 0;display:block;grid-column:1/-1}
footer{background:var(--terra);color:#fff;text-align:center;padding:20px;font-size:14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 0}
.tabs a{padding:6px 18px;border:1px solid var(--terra);color:var(--terra);text-decoration:none;font-size:14px}
.tabs a.on,.tabs a:hover{background:var(--terra);color:#fff}
.page-h{font-size:44px;margin:60px 0 0}
.about{background:var(--blush);display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:70px 60px;margin:70px 0;align-items:center}
.about .ph{aspect-ratio:4/3;background:var(--rose) center/cover}
.article{max-width:740px;margin:60px auto 80px}
.article h1{font-size:44px}.article .meta{color:var(--muted);font-size:14px}
.article .cover{width:100%;margin:26px 0}
.body{font-size:18px;line-height:1.85}.body h2{font-size:30px;margin-top:1.6em}
.body pre{background:#1e1e1e;color:#eee;padding:16px;overflow:auto;font-size:14px;line-height:1.5}
.body code{font-size:.9em;background:var(--blush);padding:1px 5px}.body pre code{background:none;padding:0}
.body blockquote{border-left:3px solid var(--terra);margin:1.5em 0;padding:.2em 1.4em;font:italic 20px var(--serif)}
@media(max-width:860px){.cols,.about{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.tile{height:130px}.tile span{margin:0}.about{padding:36px 24px}.card{grid-template-columns:1fr}.card .img{height:180px}.contact form{grid-template-columns:1fr}.hero-title{margin-top:20px}.nav nav{gap:16px}}
html{scroll-behavior:smooth}.nav nav a[href="#contact"]{cursor:pointer}

.club-hero{padding:44px 0 0}
.club-hero small{letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-size:12.5px;font-weight:700}
.club-hero h1{font-size:clamp(40px,6vw,68px);margin:.15em 0 .1em}
.club-hero p{max-width:560px;margin:0;color:var(--muted);font-size:18px}
.shelf-wrap{position:relative;margin-top:30px;background:var(--blush)}
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:max(24px,calc((100% - var(--w))/2 + 24px));padding:48px max(24px,calc((100% - var(--w))/2 + 24px)) 0;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.board{height:18px;background:linear-gradient(#d29b89,#bb5a3a 60%,#7d3c27);box-shadow:0 10px 18px rgba(62,30,19,.22)}
.sp{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0 16px;color:#fff;text-decoration:none;border-radius:3px 3px 0 0;transition:transform .25s,box-shadow .25s;box-shadow:inset 3px 0 4px -2px rgba(255,255,255,.25),inset -5px 0 7px -3px rgba(0,0,0,.35),3px 0 8px rgba(62,30,19,.18);position:relative;overflow:hidden;background-repeat:no-repeat}
.sp:hover,.sp:focus{transform:translateY(-16px);box-shadow:inset 3px 0 4px -2px rgba(255,255,255,.25),inset -5px 0 7px -3px rgba(0,0,0,.35),6px 14px 18px rgba(62,30,19,.3);z-index:2}
.sp .st{writing-mode:vertical-rl;font:700 16px/1.15 var(--serif);max-height:calc(100% - 130px);overflow:hidden}
.sp .sa{writing-mode:vertical-rl;font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.sp.d1{background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)),linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3));background-size:100% 5px,100% 5px;background-position:0 12px,0 22px}
.sp.d2{background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)),linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3));background-size:100% 5px,100% 5px;background-position:0 calc(100% - 12px),0 calc(100% - 22px)}
.sp.d3{background-image:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)),linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22));background-size:100% 30px,100% 30px;background-position:0 0,0 100%}
.sp.c2,.sp.c4{color:#3e1e13}
.shelf-meta{color:var(--muted);font-size:14px;padding:26px 24px 0}
.spine{position:relative;flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:24px 0 20px;color:#fff;text-decoration:none;border-radius:2px 2px 0 0;box-shadow:inset -5px 0 7px -3px rgba(0,0,0,.28),inset 3px 0 4px -2px rgba(255,255,255,.2),0 4px 10px rgba(62,30,19,.18);transition:transform .3s,box-shadow .3s}
.spine:hover,.spine:focus-visible{transform:translateY(-16px);box-shadow:inset -5px 0 7px -3px rgba(0,0,0,.28),inset 3px 0 4px -2px rgba(255,255,255,.2),0 18px 22px rgba(62,30,19,.3);outline:0}
.sp-t{writing-mode:vertical-rl;font:700 17px/1.1 var(--serif);max-height:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}.sp-t.sm{font-size:14px}
.sp-a{writing-mode:vertical-rl;font:400 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.88;white-space:nowrap;position:relative;z-index:1}
.spine.p1::before,.spine.p1::after{content:'';position:absolute;left:0;right:0;height:3px;background:currentColor;opacity:.45}.spine.p1::before{top:11px}.spine.p1::after{bottom:11px}
.spine.p2{padding-top:62px}.spine.p2::before{content:'';position:absolute;left:0;right:0;top:0;height:46px;background:rgba(255,255,255,.2)}
.spine.p3{padding-top:44px}.spine.p3::before{content:'';position:absolute;top:14px;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.c0{background-color:#bb5a3a}.c1{background-color:#7d3c27}.c2{background-color:#e8c0b3;color:#3e1e13}.c3{background-color:#3e1e13}.c4{background-color:#d29b89;color:#3e1e13}.c5{background-color:#9c8e8c}
.arr{display:none;position:absolute;top:34%;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22);font-size:26px;line-height:1;cursor:pointer;align-items:center;justify-content:center;color:var(--terra)}
.js .arr{display:flex}.arr.l{left:14px}.arr.r{right:14px}.arr:hover{background:var(--blush)}
.club-notes{margin-top:60px;margin-bottom:70px}.club-notes h2{font-size:32px;margin-bottom:24px}
.bp{display:grid;grid-template-columns:1fr 340px;gap:64px;margin-top:50px;margin-bottom:80px;align-items:start}
.bp .back{font-size:14px;color:var(--terra);text-decoration:none}
.bp h1{font-size:clamp(34px,5vw,52px);margin:.4em 0 .1em}.bp .by{font:italic 22px var(--serif);color:var(--muted);margin-bottom:8px}
.bp .body{margin-top:26px}
.bp-box{background:var(--blush);border-top:4px solid var(--terra);padding:28px;position:sticky;top:24px}
.bp-box .cover{width:62%;margin:0 auto 26px}
.bp-box dl{margin:0}.bp-box dt{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--terra);margin-top:16px}.bp-box dd{margin:2px 0 0}
.bp-box .btn{display:block;text-align:center;margin-top:26px}
@media(max-width:860px){.bp{grid-template-columns:1fr;gap:30px}.bp-box{position:static}.book{flex-basis:150px}.arr{display:none!important}}

.cover{position:relative;overflow:hidden;aspect-ratio:2/3;background:var(--rose) center/cover;box-shadow:0 10px 22px rgba(62,30,19,.28),inset 5px 0 7px -3px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px;color:#fff}
.cover .ct{font:700 20px/1.2 var(--serif);position:relative;z-index:1}.cover .ca{font-size:11px;letter-spacing:.14em;text-transform:uppercase;position:relative;z-index:1}
.cover.s1{justify-content:center;align-items:center;text-align:center;gap:14px}.cover.s1::before{content:'';position:absolute;inset:10px;border:1px solid currentColor;opacity:.5}
.cover.s2::after{content:attr(data-l);position:absolute;right:-6px;bottom:-26px;font:700 170px/1 var(--serif);opacity:.17}
.cover.s3{background-image:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.24) 60%)}
.bp .eyebrow{display:block;margin-top:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-size:12.5px;font-weight:700}
.bp .meet{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.bp .meet span{background:var(--blush);padding:4px 14px;font-size:13px}
.bp h1{margin-top:.15em}

.cover .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3}
.buy{margin:44px 0 0;padding-top:26px;border-top:1px solid var(--line)}.buy p{margin:0 0 14px;color:var(--muted)}.buy .btn{display:inline-block}
/* shelf: entrance + pull-out */
.sp{transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:spIn .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms);cursor:pointer}
@keyframes spIn{from{opacity:0;transform:translateY(60px) rotate(3deg)}}
.sp:hover,.sp:focus-visible{transform:translateY(-24px) rotate(-1.4deg) scale(1.03);z-index:3}
.sp:hover+.sp,.sp:focus-visible+.sp{transform:translateX(6px) rotate(.9deg)}
.sp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 18%,transparent 80%,rgba(0,0,0,.16));pointer-events:none}
/* book opening overlay */
.bk-stage{position:fixed;inset:0;z-index:9999;background:rgba(250,244,240,0);transition:background .5s;overflow:hidden;cursor:progress}
.bk-stage.on{background:rgba(250,244,240,.96)}
.bk-flip{position:fixed;perspective:1500px;z-index:2}
.bk-flip-in{position:absolute;inset:0;transform-style:preserve-3d}
.bk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 22px 44px rgba(62,30,19,.35)}
.bk-face.back{transform:rotateY(180deg)}
.bk-cv{display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px;background-size:cover;background-position:center;font-family:var(--serif)}
.bk-cv .t{font:700 24px/1.2 var(--serif)}
.bk-cv .a{font:400 12px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.bk-cv::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08) 7%,transparent 14%);pointer-events:none}
.bk-book{position:fixed;perspective:1800px;z-index:3}
.bk-pg{position:absolute;inset:0;background:#fbf6ef;border-radius:2px 6px 6px 2px;box-shadow:0 22px 44px rgba(62,30,19,.3);padding:16% 13%}
.bk-pg i{display:block;height:5px;margin:0 0 13px;background:rgba(62,30,19,.13);border-radius:3px}
.bk-pg i:nth-child(2n){width:88%}.bk-pg i:nth-child(3n){width:72%}.bk-pg i:nth-child(5n){width:94%}
.bk-lid{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d}
.bk-inside{background:#efe3d8}
.bk-inside::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.2),transparent 20%)}
/* book page: arriving from the shelf */
.bk-in body::before{content:"";position:fixed;inset:0;background:#fff;z-index:9999;pointer-events:none;animation:bkFade .7s .1s ease forwards}
@keyframes bkFade{to{opacity:0;visibility:hidden}}
.bk-in .bp-box .cover{transform-origin:left center;animation:bkSettle 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes bkSettle{from{transform:perspective(1100px) rotateY(-84deg) scale(1.3) translateX(50px);opacity:0}to{transform:none;opacity:1}}
.bk-in .bp-main>*{animation:bkRise .8s cubic-bezier(.2,.8,.2,1) both}
.bk-in .bp-main>:nth-child(1){animation-delay:.45s}.bk-in .bp-main>:nth-child(2){animation-delay:.52s}.bk-in .bp-main>:nth-child(3){animation-delay:.6s}.bk-in .bp-main>:nth-child(4){animation-delay:.68s}.bk-in .bp-main>:nth-child(n+5){animation-delay:.76s}
.bk-in .bp-box dl{animation:bkRise .8s .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes bkRise{from{opacity:0;transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}.bk-in body::before,.bk-in .bp-box .cover,.bk-in .bp-main>*,.bk-in .bp-box dl{animation:none}}</style><script>try{if(sessionStorage.getItem('bkOpen')){document.documentElement.className+=' bk-in';sessionStorage.removeItem('bkOpen')}}catch(e){}</script></head><body>
